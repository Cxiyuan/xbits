name: zeek-correlation-9.0.1

on:
  workflow_dispatch:
  push:
    paths:
      - "*/zeek/**"
      - "test/generate_pcaps.py"
      - "test/generate_recon_pcaps.py"
      - "test/generate_web_pcaps.py"
      - "test/generate_backdoor_pcaps.py"
      - "test/assert_zeek.py"
      - "test/zeek_cases.json"
      - ".github/workflows/zeek-correlation.yml"
  pull_request:
    paths:
      - "*/zeek/**"
      - "test/generate_pcaps.py"
      - "test/generate_recon_pcaps.py"
      - "test/generate_web_pcaps.py"
      - "test/generate_backdoor_pcaps.py"
      - "test/assert_zeek.py"
      - "test/zeek_cases.json"
      - ".github/workflows/zeek-correlation.yml"

jobs:
  zeek:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: dns_txt_burst
            scenario: dns-tunnel
            generator: test/generate_pcaps.py --out test/pcap
            pcap: test/pcap/txt_burst_positive.pcap
            script: DNS隧道与带外检测/zeek/dns_tunnel_score.zeek
            log: dns_correlation.log
          - case: recon_404_burst
            scenario: recon
            generator: test/generate_recon_pcaps.py --out test/recon_pcap
            pcap: test/recon_pcap/recon_curl_rate.pcap
            script: 侦察与攻击工具指纹/zeek/recon_score.zeek
            log: recon_correlation.log
          - case: web_sqli
            scenario: web-exploit
            generator: test/generate_web_pcaps.py --out test/web_pcap
            pcap: test/web_pcap/web_sqli_uri_union.pcap
            script: Web漏洞利用/zeek/web_exploit_chain.zeek
            log: web_correlation.log
          - case: backdoor_webshell
            scenario: backdoor-c2
            generator: test/generate_backdoor_pcaps.py --out test/backdoor_pcap
            pcap: test/backdoor_pcap/ws_cmd_query.pcap
            script: 后门通信/zeek/backdoor_c2_score.zeek
            log: backdoor_correlation.log
          - case: backdoor_c2_periodic
            scenario: backdoor-c2
            generator: test/generate_backdoor_pcaps.py --out test/backdoor_pcap
            pcap: test/backdoor_pcap/c2_periodic.pcap
            script: 后门通信/zeek/backdoor_c2_score.zeek
            log: backdoor_correlation.log

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"

      - name: Install PCAP generator
        run: python -m pip install --disable-pip-version-check scapy==2.6.1

      - name: Generate PCAPs
        run: ${{ matrix.generator }}

      - name: Run Zeek 9.0.1
        run: |
          set -euo pipefail
          mkdir -p "test/zeek_out/${{ matrix.case }}"
          docker run --rm \
            -v "$PWD:/work" \
            -w "/work/test/zeek_out/${{ matrix.case }}" \
            zeek/zeek:9.0.1@sha256:524cb0ce29f26a6a954fb9c357a8f92b95812476d8240f0ece26617ace249dd0 \
            zeek -b -Cr "/work/${{ matrix.pcap }}" "/work/${{ matrix.script }}" LogAscii::use_json=T
          ls -la "test/zeek_out/${{ matrix.case }}"

      - name: Assert Zeek correlation log
        run: |
          python test/assert_zeek.py \
            --log "test/zeek_out/${{ matrix.case }}/${{ matrix.log }}" \
            --scenario "${{ matrix.scenario }}" \
            --min-events 1

      - name: Upload Zeek logs
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: zeek-${{ matrix.case }}-logs
          path: |
            test/zeek_out/${{ matrix.case }}
          if-no-files-found: ignore
