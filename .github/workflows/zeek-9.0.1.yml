name: zeek-9.0.1

# Zeek has no production detection content yet. This workflow is dormant:
# it runs only on explicit dispatch or when zeek/** or its test assertions change.
on:
  workflow_dispatch:
  push:
    paths:
      - "zeek/**/*.zeek"
      - "test/zeek_cases.json"
      - "test/assert_zeek.py"
  pull_request:
    paths:
      - "zeek/**/*.zeek"
      - "test/zeek_cases.json"
      - "test/assert_zeek.py"

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"

      - name: Install test generator dependency
        run: python -m pip install --disable-pip-version-check scapy==2.6.1

      - name: Generate test PCAPs
        run: python test/generate_pcaps.py --out test/pcap

      - name: Verify Zeek version
        run: |
          docker run --rm --entrypoint /bin/sh zeek/zeek:9.0.1 -c 'zeek -v'

      - name: Run Zeek 9.0.1 on the PCAP corpus
        run: |
          set -euo pipefail
          mkdir -p test/out/zeek
          for pcap in test/pcap/*.pcap; do
            name="$(basename "$pcap" .pcap)"
            echo "== $name"
            docker run --rm --entrypoint /bin/sh \
              -v "$PWD:/work" -w /work \
              zeek/zeek:9.0.1 -c "
                set -e
                mkdir -p /work/test/out/zeek/$name
                cd /work/test/out/zeek/$name
                zeek -b -Cr /work/test/pcap/$name.pcap /work/zeek/dns_tunnel_detect.zeek
              "
          done
          sudo chmod -R a+rX test/out

      - name: Assert Zeek notices
        run: python test/assert_zeek.py --log-root test/out/zeek --cases test/zeek_cases.json

      - name: Upload Zeek logs
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: zeek-9.0.1-logs
          path: test/out/zeek
          if-no-files-found: ignore
