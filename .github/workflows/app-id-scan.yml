name: app-id-scan

on:
  push:
    paths:
      - 'app-id/**'
      - 'source/xbits-zeek/scripts/base/protocols/http/**'
      - '.github/workflows/app-id-scan.yml'
  pull_request:
    paths:
      - 'app-id/**'
      - 'source/xbits-zeek/scripts/base/protocols/http/**'
  workflow_dispatch:

jobs:
  zeek-scan-test:
    runs-on: ubuntu-latest
    container:
      image: zeek/zeek:9.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install python deps
        run: |
          apt-get update
          apt-get install -y python3 python3-pip
          python3 -m pip install --break-system-packages --no-cache-dir scapy \
            || python3 -m pip install --no-cache-dir scapy

      - name: Zeek version
        run: zeek --version

      - name: Overlay xbits-zeek HTTP parse (main.zeek)
        run: |
          TARGET=/usr/local/zeek/share/zeek/base/protocols/http/main.zeek
          if [ ! -f "$TARGET" ]; then
            TARGET=$(find / -path '*/share/zeek/base/protocols/http/main.zeek' 2>/dev/null | head -n1)
          fi
          echo "overlay -> $TARGET"
          test -n "$TARGET" && cp source/xbits-zeek/scripts/base/protocols/http/main.zeek "$TARGET"

      - name: Generate test PCAPs
        run: python3 app-id/tests/gen_pcaps.py

      - name: HTTP field extraction test (xbits-ext.zeek)
        run: python3 app-id/tests/run_http_fields.py

      - name: Run detection / false-positive tests
        run: python3 app-id/tests/run_tests.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-test-artifacts
          path: |
            app-id/tests/pcaps
            app-id/tests/manifest.json
          if-no-files-found: ignore
