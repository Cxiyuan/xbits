name: suricata-backdoor-c2-8.0.8

on:
  workflow_dispatch:
  push:
    paths:
      - "规则检测/suricata/后门通信/*.rules"
      - "规则检测/suricata/后门通信/lua/**"
      - "规则检测/zeek/后门通信/**"
      - "测试用例/assert_zeek.py"
      - "测试用例/generate_backdoor_pcaps.py"
      - "测试用例/backdoor_cases.json"
      - "测试用例/suricata-backdoor-ci.yaml.in"
      - "测试用例/assert_suricata.py"
      - "测试用例/classification.config"
      - "测试用例/reference.config"
      - ".github/workflows/suricata-backdoor-c2.yml"
  pull_request:
    paths:
      - "规则检测/suricata/后门通信/*.rules"
      - "规则检测/suricata/后门通信/lua/**"
      - "规则检测/zeek/后门通信/**"
      - "测试用例/assert_zeek.py"
      - "测试用例/generate_backdoor_pcaps.py"
      - "测试用例/backdoor_cases.json"
      - "测试用例/suricata-backdoor-ci.yaml.in"
      - "测试用例/assert_suricata.py"
      - "测试用例/classification.config"
      - "测试用例/reference.config"
      - ".github/workflows/suricata-backdoor-c2.yml"

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"

      - name: Install test generator dependency
        run: python -m pip install --disable-pip-version-check scapy==2.6.1

      - name: Generate backdoor/C2 test PCAPs
        run: python 测试用例/generate_backdoor_pcaps.py --out 测试用例/backdoor_pcap

      - name: Install Suricata build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential libcap-ng-dev libjansson-dev \
            libmagic-dev libnet1-dev libpcap-dev libpcre2-dev libtool \
            libyaml-dev make pkg-config zlib1g-dev curl

      - name: Install pinned Rust and cbindgen
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.85.0
          . "$HOME/.cargo/env"
          cargo install cbindgen --version 0.27.0 --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build Suricata 8.0.8
        run: |
          set -euo pipefail
          curl -fsSL \
            https://github.com/OISF/suricata/archive/refs/tags/suricata-8.0.8.tar.gz \
            -o /tmp/suricata-8.0.8.tar.gz
          mkdir -p /tmp/suricata-8.0.8
          tar -xzf /tmp/suricata-8.0.8.tar.gz -C /tmp/suricata-8.0.8 --strip-components=1
          cd /tmp/suricata-8.0.8
          ./autogen.sh
          ./configure --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
          suricata -V

      - name: Stage rules, Lua and configs
        run: |
          set -euo pipefail
          mkdir -p 测试用例/stage 测试用例/out/suricata
          cp "规则检测/suricata/后门通信/WebShell后门通信规则.rules" 测试用例/stage/
          cp "规则检测/suricata/后门通信/命令与控制信标规则.rules" 测试用例/stage/
          cp 规则检测/suricata/后门通信/lua/*.lua 测试用例/stage/
          cp 测试用例/classification.config 测试用例/reference.config 测试用例/stage/
          sed \
            -e "s|__RULE_DIR__|$GITHUB_WORKSPACE/测试用例/stage|g" \
            -e "s|__LOG_DIR__|$GITHUB_WORKSPACE/测试用例/out|g" \
            测试用例/suricata-backdoor-ci.yaml.in > 测试用例/suricata-backdoor-ci.yaml

      - name: Suricata config test
        run: suricata -T -c 测试用例/suricata-backdoor-ci.yaml -v

      - name: Replay PCAP corpus
        run: |
          set -euo pipefail
          for pcap in 测试用例/backdoor_pcap/*.pcap; do
            name="$(basename "$pcap" .pcap)"
            out="$GITHUB_WORKSPACE/测试用例/out/suricata/$name"
            mkdir -p "$out"
            echo "== $name"
            suricata -c 测试用例/suricata-backdoor-ci.yaml -r "$pcap" -l "$out" -k none
          done

      - name: Assert Suricata alerts
        run: python 测试用例/assert_suricata.py --eve-root 测试用例/out/suricata --cases 测试用例/backdoor_cases.json

      - name: Zeek correlation + community-id linkage
        run: |
          set -euo pipefail
          mkdir -p 测试用例/zeek_out/backdoor 测试用例/zeek_out/c2
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work/测试用例/zeek_out/backdoor \
            zeek/zeek:9.0.1@sha256:524cb0ce29f26a6a954fb9c357a8f92b95812476d8240f0ece26617ace249dd0 \
            zeek -b -Cr /work/测试用例/backdoor_pcap/ws_cmd_query.pcap /work/规则检测/zeek/后门通信/backdoor_c2_score.zeek LogAscii::use_json=T
          python 测试用例/assert_zeek.py \
            --log 测试用例/zeek_out/backdoor/backdoor_correlation.log \
            --scenario backdoor-c2 \
            --eve-root 测试用例/out/suricata \
            --case ws_cmd_query
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work/测试用例/zeek_out/c2 \
            zeek/zeek:9.0.1@sha256:524cb0ce29f26a6a954fb9c357a8f92b95812476d8240f0ece26617ace249dd0 \
            zeek -b -Cr /work/测试用例/backdoor_pcap/c2_periodic.pcap /work/规则检测/zeek/后门通信/backdoor_c2_score.zeek LogAscii::use_json=T
          python 测试用例/assert_zeek.py \
            --log 测试用例/zeek_out/c2/backdoor_correlation.log \
            --scenario backdoor-c2

      - name: Upload Suricata logs
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: suricata-backdoor-c2-8.0.8-logs
          path: |
            测试用例/out
            测试用例/zeek_out
            测试用例/suricata-backdoor-ci.yaml
          if-no-files-found: ignore
