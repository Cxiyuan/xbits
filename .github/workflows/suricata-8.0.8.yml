name: suricata-8.0.8

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"

      - name: Install test generator dependency
        run: python -m pip install --disable-pip-version-check scapy==2.6.1

      - name: Generate test PCAPs
        run: python test/generate_pcaps.py --out test/pcap

      - name: Install Suricata build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential libcap-ng-dev libjansson-dev \
            libmagic-dev libnet1-dev libpcap-dev libpcre2-dev libtool \
            libyaml-dev make pkg-config zlib1g-dev curl

      - name: Install pinned Rust and cbindgen
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.85.0
          . "$HOME/.cargo/env"
          cargo install cbindgen --version 0.27.0 --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build Suricata 8.0.8
        run: |
          set -euo pipefail
          curl -fsSL \
            https://github.com/OISF/suricata/archive/refs/tags/suricata-8.0.8.tar.gz \
            -o /tmp/suricata-8.0.8.tar.gz
          mkdir -p /tmp/suricata-8.0.8
          tar -xzf /tmp/suricata-8.0.8.tar.gz -C /tmp/suricata-8.0.8 --strip-components=1
          cd /tmp/suricata-8.0.8
          ./autogen.sh
          ./configure --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
          suricata -V

      - name: Stage rules, dataset and Lua
        run: |
          set -euo pipefail
          mkdir -p test/stage test/out/suricata
          cp "DNS隧道与带外检测/DNS隧道与带外检测规则.rules" test/stage/
          cp "DNS隧道与带外检测/dns_tunnel_allow.lst" test/stage/
          cp DNS隧道与带外检测/lua/*.lua test/stage/
          cp test/classification.config test/reference.config test/stage/
          sed \
            -e "s|__RULE_DIR__|$GITHUB_WORKSPACE/test/stage|g" \
            -e "s|__LOG_DIR__|$GITHUB_WORKSPACE/test/out|g" \
            test/suricata-ci.yaml.in > test/suricata-ci.yaml

      - name: Suricata config test
        run: suricata -T -c test/suricata-ci.yaml -v

      - name: Replay PCAP corpus
        run: |
          set -euo pipefail
          for pcap in test/pcap/*.pcap; do
            name="$(basename "$pcap" .pcap)"
            out="$GITHUB_WORKSPACE/test/out/suricata/$name"
            mkdir -p "$out"
            echo "== $name"
            suricata -c test/suricata-ci.yaml -r "$pcap" -l "$out" -k none
          done

      - name: Assert Suricata alerts
        run: python test/assert_suricata.py --eve-root test/out/suricata --cases test/cases.json


      - name: Debug TLS/DoT parsing
        if: failure()
        run: |
          set +e
          echo "== dump tls config"
          suricata --dump-config -c test/suricata-ci.yaml 2>/dev/null | grep -A10 -i "app-layer" || true
          rm -rf /tmp/tlsdbg
          mkdir -p /tmp/tlsdbg
          suricata -c test/suricata-ci.yaml -r test/pcap/dot_positive.pcap -l /tmp/tlsdbg -k none -vvv || true
          echo "== eve"
          cat /tmp/tlsdbg/eve.json || true
          echo "== suricata.log (tail)"
          tail -60 /tmp/tlsdbg/suricata.log 2>/dev/null || true
          echo "== try same TLS on port 443"
          python3 - <<'PY'
          from scapy.all import rdpcap, wrpcap, TCP
          pkts = rdpcap('test/pcap/dot_positive.pcap')
          for p in pkts:
              if p.haslayer(TCP):
                  if p[TCP].dport == 853:
                      p[TCP].dport = 443
                  if p[TCP].sport == 853:
                      p[TCP].sport = 443
          wrpcap('/tmp/tls443.pcap', pkts)
          PY
          printf '%s\n' 'alert tls any any -> any 443 (msg:"tls443"; tls.alpn; content:"dot"; sid:9999001; rev:1;)' > /tmp/tls443.rules
          rm -rf /tmp/tlsdbg443; mkdir -p /tmp/tlsdbg443
          suricata -c test/suricata-ci.yaml -S /tmp/tls443.rules -r /tmp/tls443.pcap -l /tmp/tlsdbg443 -k none || true
          echo "== eve 443"
          cat /tmp/tlsdbg443/eve.json || true

      - name: Upload Suricata logs
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: suricata-8.0.8-logs
          path: |
            test/out
            test/suricata-ci.yaml
          if-no-files-found: ignore
