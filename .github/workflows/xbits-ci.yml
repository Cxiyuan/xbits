name: xbits-cross-engine-8.0.8-9.0.1

on:
  workflow_dispatch:
  push:
    paths:
      - "xbits/**"
      - "测试用例/generate_pcaps.py"
      - "测试用例/generate_recon_pcaps.py"
      - "测试用例/generate_web_pcaps.py"
      - "测试用例/generate_backdoor_pcaps.py"
      # 本 workflow 直接跑 triage 单测 / YARA 校验 / qa_file_triage（见 match-context job），
      # 也间接受 threat-intel、allowlist 数据影响（triage 默认 hash 情报 + xbits 情报查询）。
      - "triage/**"
      - "threat-intel/**"
      - "allowlist/**"
      # suricata-live job 会 cp 这些配置文件与 .yaml.in 生成运行时配置。
      - "测试用例/*.config"
      - "测试用例/*.yaml.in"
      # suricata-live job 只 stage 这 4 个自研场景目录的 rules/lua/lst；不整目录监听
      # 规则检测/**，避免与 suricata-* 场景工作流对同一批文件重复触发。
      - "规则检测/suricata/DNS隧道与带外检测/*.rules"
      - "规则检测/suricata/DNS隧道与带外检测/lua/**"
      - "规则检测/suricata/DNS隧道与带外检测/dns_tunnel_allow.lst"
      - "规则检测/suricata/侦察与攻击工具指纹/*.rules"
      - "规则检测/suricata/侦察与攻击工具指纹/lua/**"
      - "规则检测/suricata/Web漏洞利用/*.rules"
      - "规则检测/suricata/Web漏洞利用/lua/**"
      - "规则检测/suricata/后门通信/*.rules"
      - "规则检测/suricata/后门通信/lua/**"
      # match-context job 的 --production-meta：真实规则库元数据（V-12 raw-URI 回归）
      - "规则检测/xbits/规则库元数据/match_buffers.json"
      - ".github/workflows/xbits-ci.yml"
  pull_request:
    paths:
      - "xbits/**"
      - "测试用例/generate_pcaps.py"
      - "测试用例/generate_recon_pcaps.py"
      - "测试用例/generate_web_pcaps.py"
      - "测试用例/generate_backdoor_pcaps.py"
      # 本 workflow 直接跑 triage 单测 / YARA 校验 / qa_file_triage（见 match-context job），
      # 也间接受 threat-intel、allowlist 数据影响（triage 默认 hash 情报 + xbits 情报查询）。
      - "triage/**"
      - "threat-intel/**"
      - "allowlist/**"
      # suricata-live job 会 cp 这些配置文件与 .yaml.in 生成运行时配置。
      - "测试用例/*.config"
      - "测试用例/*.yaml.in"
      # suricata-live job 只 stage 这 4 个自研场景目录的 rules/lua/lst；不整目录监听
      # 规则检测/**，避免与 suricata-* 场景工作流对同一批文件重复触发。
      - "规则检测/suricata/DNS隧道与带外检测/*.rules"
      - "规则检测/suricata/DNS隧道与带外检测/lua/**"
      - "规则检测/suricata/DNS隧道与带外检测/dns_tunnel_allow.lst"
      - "规则检测/suricata/侦察与攻击工具指纹/*.rules"
      - "规则检测/suricata/侦察与攻击工具指纹/lua/**"
      - "规则检测/suricata/Web漏洞利用/*.rules"
      - "规则检测/suricata/Web漏洞利用/lua/**"
      - "规则检测/suricata/后门通信/*.rules"
      - "规则检测/suricata/后门通信/lua/**"
      # match-context job 的 --production-meta：真实规则库元数据（V-12 raw-URI 回归）
      - "规则检测/xbits/规则库元数据/match_buffers.json"
      - ".github/workflows/xbits-ci.yml"

env:
  CARGO_TERM_COLOR: always
  ZEEK_IMAGE: zeek/zeek:9.0.1@sha256:524cb0ce29f26a6a954fb9c357a8f92b95812476d8240f0ece26617ace249dd0

jobs:
  workflow-paths:
    name: CI paths consistency gate (static)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      # 纯静态门禁：每个 workflow 自己的 paths: 必须覆盖它实际读取的仓库路径。
      # 防的是「新增目录（triage/、threat-intel/、allowlist/…）没进 paths → 改被测代码
      # CI 一次都不跑」这类结构性假绿（qa/QA_REPORT.md V-16 / S-01）。
      - name: Assert workflow paths cover every QA-read repo path
        run: python3 xbits/test/qa_workflow_paths.py

  zeek-plugin-build:
    name: Zeek 9.0.1 thin hook plugin build
    needs: rust
    runs-on: ubuntu-22.04
    container:
      image: zeek/zeek:9.0.1
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Install compiler
        run: |
          apt-get update
          apt-get install -y g++ make python3 python3-pip
          python3 -m pip install --break-system-packages --no-cache-dir scapy || python3 -m pip install --no-cache-dir scapy
      - name: Build Zeek thin hook plugin
        run: |
          export PATH=/usr/local/zeek/bin:$PATH
          make -C xbits/zeek-plugin
      - name: Download xbits binary
        uses: actions/download-artifact@v4.3.0
        with:
          name: xbits-binary
          path: xbits/target/release
      - name: Generate web PCAP for Zeek hook runtime
        run: python3 测试用例/generate_web_pcaps.py --out /tmp/web-pcap
      - name: Runtime test xbits Zeek thin hook
        run: |
          set -euo pipefail
          export PATH=/usr/local/zeek/bin:$PATH
          chmod +x xbits/target/release/xbits
          rm -f /tmp/xbits-hook.sock /tmp/xbits-hook.out
          xbits/target/release/xbits --hook-socket /tmp/xbits-hook.sock \
            --rules xbits/rules/default.json >/tmp/xbits-hook.out 2>/tmp/xbits-hook.err &
          echo $! >/tmp/xbits-hook.pid
          for i in $(seq 1 50); do
            [ -S /tmp/xbits-hook.sock ] && break
            sleep 0.1
          done
          if [ ! -S /tmp/xbits-hook.sock ]; then
            echo "::error::xbits hook socket never appeared"; cat /tmp/xbits-hook.err || true; exit 1
          fi
          ZEEK_PLUGIN_PATH="$PWD/xbits/zeek-plugin" \
          ZEEK_PLUGIN_ACTIVATE="Xbits::Hook" \
          XBITS_HOOK_SOCKET=/tmp/xbits-hook.sock \
            zeek -Cr /tmp/web-pcap/web_sqli_uri_union.pcap
          # 轮询到 engine 真正写出匹配的 JSON 行并校验字段（替代 sleep+grep 子串）
          python3 xbits/test/assert_hook_output.py \
            --file /tmp/xbits-hook.out --timeout 30 \
            --rule-id xb-zeek-http-request --reason zeek-http-request \
            --allow-zero-signature-id \
            --require-fields rule_id,reason,src,dst,proto
          kill -TERM "$(cat /tmp/xbits-hook.pid)" 2>/dev/null || true
          rc=0; wait "$(cat /tmp/xbits-hook.pid)" 2>/dev/null || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 143 ]; then
            echo "::error::xbits exited rc=$rc"; cat /tmp/xbits-hook.err || true; exit 1
          fi
          if grep -Eq 'bad hook event|hook accept error|hook read error|panicked' /tmp/xbits-hook.err; then
            echo "::error::engine stderr anomalies"; cat /tmp/xbits-hook.err; exit 1
          fi

  rust:
    name: Rust bridge tests and release build
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install pinned Rust 1.85.0
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.85.0
          . "$HOME/.cargo/env"
          rustup default 1.85.0
          rustup component add rustfmt --toolchain 1.85.0
          rustc --version
          cargo --version
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Format code
        run: cargo fmt --manifest-path xbits/Cargo.toml --all

      - name: Unit and socket tests
        run: |
          set -o pipefail
          cargo test --manifest-path xbits/Cargo.toml --locked > /tmp/xbits-cargo.log 2>&1
          st=$?
          cat /tmp/xbits-cargo.log
          if [ "$st" -ne 0 ]; then
            grep -E 'error|FAILED|panicked|assertion|test result' /tmp/xbits-cargo.log | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$st"

      - name: Upload cargo test log on failure
        if: failure()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: xbits-cargo-test-log
          path: /tmp/xbits-cargo.log
          if-no-files-found: ignore


      - name: Build release binary
        run: cargo build --manifest-path xbits/Cargo.toml --release --locked

      - name: Upload xbits binary
        uses: actions/upload-artifact@v4.4.3
        with:
          name: xbits-binary
          path: xbits/target/release/xbits
          if-no-files-found: error

  zeek-stdin:
    name: Zeek 9.0.1 event bridge (stdin)
    needs: rust
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"

      - name: Install test PCAP generator dependency
        run: python -m pip install --disable-pip-version-check scapy==2.6.1

      - name: Generate Web regression PCAP
        run: python 测试用例/generate_web_pcaps.py --out 测试用例/web_pcap

      - name: Download xbits binary
        uses: actions/download-artifact@v4.3.0
        with:
          name: xbits-binary
          path: xbits/target/release

      - name: Make xbits executable
        run: chmod +x xbits/target/release/xbits

      - name: Verify xbits stdin bridge
        run: |
          set -euo pipefail
          # 旧写法 `| grep -q '"signature_id":9103001'` 是回声测试：输入第 1 行本身就含该串。
          # 这里解析输出 JSON，断言"恰好 1 条 alert 且字段齐全"（第 2 行 flow 不得产生输出）。
          xbits/target/release/xbits --stdin < xbits/testdata/alert.jsonl > /tmp/xbits-stdin.out
          cat /tmp/xbits-stdin.out
          python3 xbits/test/assert_xbits.py \
            --log /tmp/xbits-stdin.out --source alert-json \
            --signature-id 9103001 --expect-count 1 \
            --require-fields signature_id,signature,src,dst,proto,community_id

      - name: Verify xbits central hook engine
        run: |
          python xbits/test/hook_engine_smoke.py \
            --xbits xbits/target/release/xbits \
            --rules xbits/rules/default.json

      # V-14 方案①：success_rules 请求→响应关联 e2e（配对/对照/无请求/坏配置）
      - name: Verify xbits success_rules request-response correlation
        run: |
          set -euo pipefail
          python xbits/test/qa_xbits_success_rules.py --self-test
          python xbits/test/qa_xbits_success_rules.py \
            --xbits xbits/target/release/xbits
          # ::warning:: TODO: 120s 真实 TTL 等待的进程级验证按需跑
          #   python xbits/test/qa_xbits_success_rules.py --xbits xbits/target/release/xbits --with-ttl-wait
          #   （默认 CI 不跑，避免每轮多 2 分钟；TTL 数值本体由 engine.rs 单测覆盖）

      - name: Run Zeek Input event bridge
        run: |
          set -euo pipefail
          rm -rf 测试用例/zeek_out/xbits-stdin
          mkdir -p 测试用例/zeek_out/xbits-stdin
          timeout 30s docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work/测试用例/zeek_out/xbits-stdin \
            "$ZEEK_IMAGE" \
            zeek -b -Cr /work/测试用例/web_pcap/web_sqli_uri_union.pcap \
              /work/xbits/zeek/xbits_test.zeek LogAscii::use_json=T
          cat 测试用例/zeek_out/xbits-stdin/xbits_correlation.log
          python xbits/test/assert_xbits.py \
            --log 测试用例/zeek_out/xbits-stdin/xbits_correlation.log \
            --signature-id 9103001

      - name: Upload Zeek stdin logs
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: xbits-zeek-stdin-logs
          path: 测试用例/zeek_out/xbits-stdin
          if-no-files-found: ignore

  match-context:
    name: xbits match_context + suppression QA
    needs: rust
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Download xbits binary
        uses: actions/download-artifact@v4.3.0
        with:
          name: xbits-binary
          path: xbits/target/release

      - name: Make xbits executable
        run: chmod +x xbits/target/release/xbits

      - name: Verify match_context + suppression behavior
        run: |
          set -euo pipefail
          # --production-meta：用真实规则库元数据（19k SID）追加 V-12 回归用例
          # （http.uri.raw 规则的抑制 key 必须来自 match_context 导出，不塌缩、不兜底）。
          python xbits/test/qa_xbits_match_context.py \
            --xbits xbits/target/release/xbits \
            --validator 'python3 xbits/test/stub_validator.py' \
            --rules xbits/testdata/match_context_rules.json \
            --match-buffers xbits/testdata/match_buffers.json \
            --production-meta '规则检测/xbits/规则库元数据/match_buffers.json'

      - name: Static triage unit tests (triage/, stdlib path)
        run: |
          set -euo pipefail
          XBITS_EXPECT_ENHANCED=0 python3 triage/tests/test_triage.py

      - name: Static triage unit tests (triage/, pefile+pyelftools+YARA enhanced path)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pefile pyelftools yara-python
          # XBITS_EXPECT_ENHANCED=1：增强路径必须断言真实字段值；缺依赖直接失败而不是 skip
          XBITS_EXPECT_ENHANCED=1 python3 triage/tests/test_triage.py

      - name: Validate triage YARA rules compile + positive/negative sample pair
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check yara-python
          python3 triage/tests/validate_rules.py

      - name: File static-triage orchestration QA (suricata fileinfo -> xbits -> triage)
        run: |
          set -euo pipefail
          python xbits/test/qa_file_triage.py \
            --xbits xbits/target/release/xbits \
            --triage-cmd "python3 triage/triage.py --stdin"

  suricata-live:
    name: Suricata 8.0.8 -> xbits -> Zeek 9.0.1 live linkage
    needs: rust
    runs-on: ubuntu-22.04
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"

      - name: Install test PCAP generator dependency
        run: python -m pip install --disable-pip-version-check scapy==2.6.1

      - name: Generate scenario regression PCAPs
        run: |
          python 测试用例/generate_pcaps.py --out 测试用例/pcap
          python 测试用例/generate_recon_pcaps.py --out 测试用例/recon_pcap
          python 测试用例/generate_web_pcaps.py --out 测试用例/web_pcap
          python 测试用例/generate_backdoor_pcaps.py --out 测试用例/backdoor_pcap

      - name: Install Suricata build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential libcap-ng-dev libjansson-dev \
            libmagic-dev libnet1-dev libpcap-dev libpcre2-dev libtool \
            libyaml-dev make pkg-config zlib1g-dev curl

      - name: Install pinned Rust and cbindgen
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.85.0
          . "$HOME/.cargo/env"
          rustup default 1.85.0
          cargo install cbindgen --version 0.27.0 --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build Suricata 8.0.8
        run: |
          set -euo pipefail
          curl -fsSL \
            https://github.com/OISF/suricata/archive/refs/tags/suricata-8.0.8.tar.gz \
            -o /tmp/suricata-8.0.8.tar.gz
          mkdir -p /tmp/suricata-8.0.8
          tar -xzf /tmp/suricata-8.0.8.tar.gz -C /tmp/suricata-8.0.8 --strip-components=1
          python3 "$GITHUB_WORKSPACE/xbits/suricata-plugin/apply_match_context_patch.py" /tmp/suricata-8.0.8
          cd /tmp/suricata-8.0.8
          ./autogen.sh
          ./configure --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
          suricata -V

      - name: Build xbits Suricata thin hook plugin
        run: make -C xbits/suricata-plugin SURICATA_SRC=/tmp/suricata-8.0.8

      - name: Download xbits binary
        uses: actions/download-artifact@v4.3.0
        with:
          name: xbits-binary
          path: xbits/target/release

      - name: Stage rules, Lua and Unix stream configs
        run: |
          set -euo pipefail
          mkdir -p 测试用例/stage/dns 测试用例/stage/recon 测试用例/stage/web 测试用例/stage/backdoor
          mkdir -p 测试用例/out/suricata/xbits-web 测试用例/out/suricata/xbits-dns \
            测试用例/out/suricata/xbits-recon 测试用例/out/suricata/xbits-backdoor 测试用例/xbits_run

          cp "规则检测/suricata/DNS隧道与带外检测/DNS隧道与带外检测规则.rules" 测试用例/stage/dns/
          cp "规则检测/suricata/DNS隧道与带外检测/dns_tunnel_allow.lst" 测试用例/stage/dns/
          cp 规则检测/suricata/DNS隧道与带外检测/lua/*.lua 测试用例/stage/dns/

          cp "规则检测/suricata/侦察与攻击工具指纹/侦察与攻击工具指纹规则.rules" 测试用例/stage/recon/
          cp 规则检测/suricata/侦察与攻击工具指纹/lua/*.lua 测试用例/stage/recon/

          cp "规则检测/suricata/Web漏洞利用/Web漏洞利用规则.rules" 测试用例/stage/web/
          cp 规则检测/suricata/Web漏洞利用/lua/*.lua 测试用例/stage/web/

          cp "规则检测/suricata/后门通信/WebShell后门通信规则.rules" 测试用例/stage/backdoor/
          cp "规则检测/suricata/后门通信/命令与控制信标规则.rules" 测试用例/stage/backdoor/
          cp 规则检测/suricata/后门通信/lua/*.lua 测试用例/stage/backdoor/

          for scenario in dns recon web backdoor; do
            cp 测试用例/classification.config 测试用例/reference.config "测试用例/stage/$scenario/"
          done

          chmod +x xbits/target/release/xbits
          sed \
            -e "s|__RULE_DIR__|$GITHUB_WORKSPACE/测试用例/stage/web|g" \
            -e "s|__LOG_DIR__|$GITHUB_WORKSPACE/测试用例/out|g" \
            -e "s|__EVE_SOCKET__|$GITHUB_WORKSPACE/测试用例/xbits_run/eve.sock|g" \
            xbits/testdata/suricata-unix-stream.yaml.in > 测试用例/suricata-web-xbits.yaml

          for scenario in dns recon backdoor; do
            case "$scenario" in
              dns) template=测试用例/suricata-ci.yaml.in ;;
              recon) template=测试用例/suricata-recon-ci.yaml.in ;;
              backdoor) template=测试用例/suricata-backdoor-ci.yaml.in ;;
            esac
            sed \
              -e "s|__RULE_DIR__|$GITHUB_WORKSPACE/测试用例/stage/$scenario|g" \
              -e "s|__LOG_DIR__|$GITHUB_WORKSPACE/测试用例/out|g" \
              -e "s|filetype: file|filetype: unix_stream|g" \
              -e "s|filename: eve.json|filename: $GITHUB_WORKSPACE/测试用例/xbits_run/eve.sock|g" \
              "$template" > "测试用例/suricata-$scenario-xbits.yaml"
            cat "测试用例/suricata-$scenario-xbits.yaml"
          done
          cat 测试用例/suricata-web-xbits.yaml

      - name: Verify Suricata configs
        run: |
          for config in 测试用例/suricata-dns-xbits.yaml 测试用例/suricata-recon-xbits.yaml \
            测试用例/suricata-web-xbits.yaml 测试用例/suricata-backdoor-xbits.yaml; do
            echo "== $config"
            suricata -T -c "$config" -v
          done

      - name: Runtime test xbits Suricata thin hook
        run: |
          set -euo pipefail
          sed -e 's|filetype: unix_stream|filetype: xbits-hook|' \
              -e "s|filename: .*eve.sock|filename: xbits-hook|" \
              测试用例/suricata-web-xbits.yaml > 测试用例/suricata-hook-test.yaml
          printf '\nplugins:\n  - %s/xbits/suricata-plugin/xbits-suricata-hook.so\n' "$GITHUB_WORKSPACE" >> 测试用例/suricata-hook-test.yaml
          chmod +x xbits/target/release/xbits
          mkdir -p /tmp/suricata-hook-out
          rm -f /tmp/xbits-hook.sock /tmp/xbits-hook.out
          xbits/target/release/xbits --hook-socket /tmp/xbits-hook.sock \
            --rules xbits/rules/default.json >/tmp/xbits-hook.out 2>/tmp/xbits-hook.err &
          echo $! >/tmp/xbits-hook.pid
          for i in $(seq 1 50); do
            [ -S /tmp/xbits-hook.sock ] && break
            sleep 0.1
          done
          if [ ! -S /tmp/xbits-hook.sock ]; then
            echo "::error::xbits hook socket never appeared"; cat /tmp/xbits-hook.err || true; exit 1
          fi
          XBITS_HOOK_SOCKET=/tmp/xbits-hook.sock \
            suricata -r 测试用例/web_pcap/web_sqli_uri_union.pcap \
            -c 测试用例/suricata-hook-test.yaml -l /tmp/suricata-hook-out
          cat /tmp/xbits-hook.out
          # 轮询到匹配 JSON 行 + 字段校验（替代 sleep 1 + grep 子串）
          python3 xbits/test/assert_hook_output.py \
            --file /tmp/xbits-hook.out --timeout 30 \
            --rule-id xb-suricata-web-sqli --reason suricata-web-sqli \
            --signature-id 9103001 \
            --require-fields rule_id,reason,signature_id,src,dst,proto
          kill -TERM "$(cat /tmp/xbits-hook.pid)" 2>/dev/null || true
          rc=0; wait "$(cat /tmp/xbits-hook.pid)" 2>/dev/null || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 143 ]; then
            echo "::error::xbits exited rc=$rc"; cat /tmp/xbits-hook.err || true; exit 1
          fi
          if grep -Eq 'bad hook event|hook accept error|hook read error|panicked' /tmp/xbits-hook.err; then
            echo "::error::engine stderr anomalies"; cat /tmp/xbits-hook.err; exit 1
          fi

      - name: Start Zeek with xbits listener
        run: |
          set -euo pipefail
          rm -f 测试用例/xbits_run/eve.sock 测试用例/zeek_out/xbits-live/xbits_correlation.log
          mkdir -p 测试用例/zeek_out/xbits-live
          docker rm -f xbits-zeek >/dev/null 2>&1 || true
          docker run --name xbits-zeek \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work/测试用例/zeek_out/xbits-live \
            -d "$ZEEK_IMAGE" \
            zeek -b -Cr /work/测试用例/web_pcap/web_sqli_uri_union.pcap \
              /work/xbits/zeek/xbits_live.zeek LogAscii::use_json=T
          for i in $(seq 1 100); do
            if [ -S 测试用例/xbits_run/eve.sock ]; then
              echo "xbits listener ready"
              exit 0
            fi
            sleep 0.1
          done
          echo "xbits listener did not bind" >&2
          docker logs xbits-zeek >&2 || true
          exit 1

      - name: Replay PCAP through Suricata Unix stream
        run: |
          set -euo pipefail
          if ! suricata -c 测试用例/suricata-web-xbits.yaml \
            -r 测试用例/web_pcap/web_sqli_uri_union.pcap \
            -l 测试用例/out/suricata/xbits-web -k none; then
            cat 测试用例/out/suricata/xbits-web/suricata.log 2>/dev/null || true
            docker logs xbits-zeek 2>&1 || true
            exit 1
          fi
          for i in $(seq 1 100); do
            if [ -f 测试用例/zeek_out/xbits-live/xbits_correlation.log ]; then
              break
            fi
            sleep 0.2
          done
          docker logs xbits-zeek > 测试用例/zeek_out/xbits-live/docker.log 2>&1 || true
          docker stop xbits-zeek >/dev/null 2>&1 || true
          docker rm -f xbits-zeek >/dev/null 2>&1 || true
          cat 测试用例/out/suricata/xbits-web/suricata.log 2>/dev/null || true
          cat 测试用例/zeek_out/xbits-live/docker.log 2>/dev/null || true
          cat 测试用例/out/suricata/xbits-web/eve.json 2>/dev/null || true
          cat 测试用例/zeek_out/xbits-live/xbits_correlation.log 2>/dev/null || true
          # 轮询到满足条件的 JSON 行（超时即失败），并校验字段集合
          python3 xbits/test/assert_xbits.py \
            --log 测试用例/zeek_out/xbits-live/xbits_correlation.log \
            --signature-id 9103001 --wait-timeout 45 \
            --require-fields community_id,src,dst,reason,related_sids

      - name: Run DNS, recon and backdoor scenarios through xbits
        run: |
          set -euo pipefail

          run_case() {
            local scenario="$1"
            local config="$2"
            local pcap="$3"
            local sid="$4"
            local container="xbits-zeek-$scenario"
            local out="测试用例/zeek_out/xbits-live"
            local suri_out="测试用例/out/suricata/xbits-$scenario"

            echo "== $scenario"
            mkdir -p "$out" "$suri_out"
            rm -f 测试用例/xbits_run/eve.sock "$out/xbits_correlation.log"
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker run --name "$container" \
              -v "$GITHUB_WORKSPACE:/work" \
              -w "/work/$out" \
              -d "$ZEEK_IMAGE" \
              zeek -b -Cr "/work/$pcap" \
                /work/xbits/zeek/xbits_live.zeek LogAscii::use_json=T

            for i in $(seq 1 100); do
              [ -S 测试用例/xbits_run/eve.sock ] && break
              sleep 0.1
            done
            if [ ! -S 测试用例/xbits_run/eve.sock ]; then
              docker logs "$container" >&2 || true
              return 1
            fi

            if ! suricata -c "$config" -r "$pcap" -l "$suri_out" -k none; then
              cat "$suri_out/suricata.log" 2>/dev/null || true
              docker logs "$container" 2>&1 || true
              return 1
            fi
            for i in $(seq 1 100); do
              [ -f "$out/xbits_correlation.log" ] && break
              sleep 0.2
            done

            docker logs "$container" > "$out/docker-$scenario.log" 2>&1 || true
            docker stop "$container" >/dev/null 2>&1 || true
            docker rm -f "$container" >/dev/null 2>&1 || true
            # 文件存在后再轮询到满足条件的 JSON 行；超时即失败并打印原始日志
            cp "$out/xbits_correlation.log" "$out/${scenario}_correlation.log"
            cat "$out/${scenario}_correlation.log"
            python3 xbits/test/assert_xbits.py \
              --log "$out/${scenario}_correlation.log" \
              --signature-id "$sid" --wait-timeout 45 \
              --require-fields community_id,src,dst,reason,related_sids
          }

          run_case dns 测试用例/suricata-dns-xbits.yaml \
            测试用例/pcap/txt_burst_positive.pcap 9109103
          run_case recon 测试用例/suricata-recon-xbits.yaml \
            测试用例/recon_pcap/recon_404_burst.pcap 9101109
          run_case backdoor 测试用例/suricata-backdoor-xbits.yaml \
            测试用例/backdoor_pcap/ws_cmd_query.pcap 9104002

      - name: Upload live linkage logs
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: xbits-suricata-zeek-live-logs
          path: |
            测试用例/out
            测试用例/zeek_out
            测试用例/suricata-*-xbits.yaml
          if-no-files-found: ignore


