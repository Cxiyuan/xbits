# ============================================================================
# Suricata 全局抑制 / 限流示例（threshold.config）
# ----------------------------------------------------------------------------
# 启用方式（suricata.yaml）：
#   threshold-file: /etc/suricata/threshold.config
#
# 原则
#   1. 只抑制"已知安全设备 / 授权窗口"的来源，不抑制检测能力本身。
#   2. 每条抑制必须有工单号与到期日期（写在注释里，人工审计）。
#   3. Tier A（OOB 平台、已知隧道 IOC）默认不做全局抑制，只按源抑制。
#   4. 抑制事件量要纳入月度审计，防止"抑制变盲区"。
# ============================================================================

# ----------------------------------------------------------------------------
# 邮件安全网关 / URL 检测沙箱
# 这些设备会主动引爆 canarytokens、OAST 链接，产生"自己人打自己人"告警。
# 工单：SEC-2026-1107  到期：2027-02-01
# ----------------------------------------------------------------------------
suppress gen_id 1, sig_id 9109004, track by_src, ip 10.10.5.21
suppress gen_id 1, sig_id 9109005, track by_src, ip 10.10.5.21

# ----------------------------------------------------------------------------
# 授权红队 / 漏洞扫描器
# 工单：SEC-2026-1108  到期：2026-12-31
# ----------------------------------------------------------------------------
suppress gen_id 1, sig_id 9109004, track by_src, ip 10.20.9.9
suppress gen_id 1, sig_id 9109005, track by_src, ip 10.20.9.9

# ----------------------------------------------------------------------------
# 输出层限流（不影响检测与 EVE 留痕；规则层已不再写 limit）
# 结构规则在大型网络中量可能较大，按源限流后再进研判队列。
# ----------------------------------------------------------------------------
event_filter gen_id 1, sig_id 9109002, type limit, track by_src, count 5, seconds 3600
event_filter gen_id 1, sig_id 9109003, type limit, track by_src, count 5, seconds 3600

# 低置信线索：每个源每天最多 1 条告警
event_filter gen_id 1, sig_id 9109006, type limit, track by_src, count 1, seconds 86400
event_filter gen_id 1, sig_id 9109103, type both, track by_src, count 1, seconds 86400
