%YAML 1.1
---
# 探针规则转换产物的 Suricata 加载验证配置（由 convert_probe_rules.py 生成）
default-log-dir: /tmp/suri-out

vars:
  address-groups:
    HOME_NET: "any"
    EXTERNAL_NET: "any"
    CLIENT_NET: "any"
  port-groups:
    HTTP_PORTS: "[80,8080,8000,443,8443]"
    MAIL_PORTS: "[25,110,143,587,993,995]"

default-rule-path: /opt/xbits/rules/suricata
rule-files:
  - "suricata/应用软件漏洞/application.rules"
  - "suricata/恶意软件/后门/backdoor.rules"
  - "suricata/其他/bp_ips.rules"
  - "suricata/暴力破解/brute_force.rules"
  - "suricata/网络服务漏洞/数据库/database.rules"
  - "suricata/网络服务漏洞/DNS/dns.rules"
  - "suricata/文件与协议解析漏洞/file.rules"
  - "suricata/网络服务漏洞/FTP/ftp.rules"
  - "suricata/网络服务漏洞/邮件/mail.rules"
  - "suricata/应用软件漏洞/媒体服务/media.rules"
  - "suricata/网络设备漏洞/network_device.rules"
  - "suricata/恶意软件/Shellcode/shellcode.rules"
  - "suricata/恶意软件/间谍软件/spyware.rules"
  - "suricata/主机系统漏洞/system.rules"
  - "suricata/网络服务漏洞/Telnet/telnet.rules"
  - "suricata/网络服务漏洞/TFTP/tftp.rules"
  - "suricata/恶意软件/木马/trojan.rules"
  - "suricata/Web攻击/Web服务漏洞/web.rules"
  - "suricata/Web攻击/客户端组件漏洞/web_activex.rules"
  - "suricata/Web攻击/浏览器漏洞/web_browse.rules"
  - "suricata/恶意软件/蠕虫/worm.rules"
  - "suricata/Web攻击/目录遍历/directory_tranversal.rules"
  - "suricata/Web攻击/文件包含/file_include.rules"
  - "suricata/Web攻击/敏感关键词/gray_keyword.rules"
  - "suricata/Web攻击/信息泄露/information_disclose.rules"
  - "suricata/Web攻击/命令注入/oscmd.rules"
  - "suricata/Web攻击/SQL注入/sql.strong.rules"
  - "suricata/Web攻击/SQL注入/sql.weak.rules"
  - "suricata/Web攻击/扫描器/web_scan.rules"
  - "suricata/Web攻击/Web应用漏洞/webapp.rules"
  - "suricata/Web攻击/XSS/xss.rules"
  - "suricata/Web攻击/WebShell/webshell_detect.request.rules"
  - "suricata/Web攻击/WebShell/webshell_detect.rules"
  - "suricata/Web攻击/命令执行/cmd_executed.request.rules"
  - "suricata/Web攻击/命令执行/cmd_executed.rules"
  - "suricata/Web攻击/命令注入/cmd.rules"
  - "suricata/配置与运维缺陷/config_error.rules"
  - "suricata/Web攻击/目录遍历/directory_traversal.rules"
  - "suricata/Web攻击/文件上传/file_upload.rules"
  - "suricata/其他/other.rules"
  - "suricata/Web攻击/文件包含/rfi.rules"
  - "suricata/Web攻击/SQL注入/sql.rules"
  - "suricata/Web攻击/XSS/pvs-xss.rules"
  - "suricata/攻击成功确认/cmd_executed/cmd_executed.rules"
  - "suricata/攻击成功确认/component/component.rules"
  - "suricata/攻击成功确认/information_disclose/information_disclose.rules"
  - "suricata/攻击成功确认/login/login.rules"
  - "suricata/恶意URL/malice_url_report.rules"

classification-file: /opt/xbits/rules/classification.config
reference-config-file: /opt/xbits/rules/reference.config

# 仅做规则加载验证：不启用插件/事件输出
outputs:
  - eve-log:
      enabled: no
